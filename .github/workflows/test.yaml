name: C/C++ CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/szbenedek2006/rig-linux:latest
    steps:
    - name: Clone repo
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: make ARCH=x86_64
      run: make

  build-i686:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/szbenedek2006/rig-linux:latest
    steps:
    - name: Clone repo
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: make
      run: make ARCH=i686 CROSS_COMPILE=i686-linux-gnu-

  build-aarch64:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/szbenedek2006/rig-linux:latest
    steps:
    - name: Clone repo
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: make ARCH=aarch64 CROSS_COMPILE=aarch64-linux-gnu-
      run: make

  build-armv7l:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/szbenedek2006/rig-linux:latest
    steps:
    - name: Clone repo
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: make ARCH=armv7l CROSS_COMPILE=arm-linux-gnueabihf-
      run: make

  build-riscv64:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/szbenedek2006/rig-linux:latest
    steps:
    - name: Clone repo
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: make ARCH=riscv64 CROSS_COMPILE=riscv64-linux-gnu-
      run: make
